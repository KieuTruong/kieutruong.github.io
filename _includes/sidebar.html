<div class="jumbotron">
  {% include scholar_stats.html compact=true %}
</div>

<div class="jumbotron">
  <h4 class="section-title">News</h4>
  <ul class="timeline">
    {% for article in site.data.news limit:4 %}
    <li><span class="tl-date">{{ article.date }}</span><span class="tl-text">{{ article.headline }}</span></li>
    {% endfor %}
  </ul>
  <p style="margin:14px 0 0"><a class="see-all" href="{{ site.url }}{{ site.baseurl }}/allnews.html">All news <i class="fa fa-arrow-right"></i></a></p>
</div>
