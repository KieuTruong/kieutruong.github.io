# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["source"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuilds every day to refresh the Google Scholar and visitor numbers
  schedule:
    - cron: "0 3 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# (contents: write lets the build save refreshed Scholar and visitor numbers)
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Pinned: the setup-ruby release below can't install Ruby on ubuntu-latest
    # since it moved to Ubuntu 26.04, which made every build fail from 16 Nov 2026
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Google Scholar metrics
        # Reads the profile page, falls back to SerpAPI if Google blocks it,
        # and keeps the existing numbers if both fail
        continue-on-error: true
        timeout-minutes: 5
        run: python _scripts/update_scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Update visitor numbers
        # Keeps the existing numbers if GoatCounter can't be read
        continue-on-error: true
        timeout-minutes: 5
        run: ruby _scripts/update_visitors.rb
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - name: Save refreshed numbers to the repository
        # Commits the new numbers so a later failed update falls back to these,
        # not to old ones. Commits made with GITHUB_TOKEN don't start another run.
        if: github.ref == 'refs/heads/source'
        continue-on-error: true
        run: |
          git add _data/scholar.yml _data/visitors.yml
          if git diff --cached --quiet; then
            echo "Numbers unchanged; nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Scholar and visitor numbers"
          git pull --rebase origin source
          git push origin HEAD:source
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
